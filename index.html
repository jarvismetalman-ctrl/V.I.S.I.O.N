<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V.I.S.I.O.N</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14100a;
    --bg-glow: #3a2b08;
    --gold: #ffc61a;
    --gold-soft: #ffdf6b;
    --gold-dim: rgba(255, 198, 26, 0.35);
    --gold-faint: rgba(255, 198, 26, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: 'Rajdhani', sans-serif;
    color: var(--gold);
    background:
      radial-gradient(ellipse at 50% 50%, var(--bg-glow) 0%, var(--bg) 70%);
  }

  /* Workmat grid */
  .grid {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--gold-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--gold-faint) 1px, transparent 1px),
      linear-gradient(rgba(255,198,26,0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,198,26,0.16) 1px, transparent 1px);
    background-size: 30px 30px, 30px 30px, 150px 150px, 150px 150px;
    background-position: center;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 15%, transparent 85%);
            mask-image: radial-gradient(circle at 50% 50%, #000 15%, transparent 85%);
  }

  canvas#particles { position: fixed; inset: 0; width: 100%; height: 100%; }

  /* HUD text */
  .corner {
    position: fixed; top: 28px;
    font-family: 'Orbitron', sans-serif;
    text-shadow: 0 0 12px var(--gold-dim);
  }
  .tl { left: 32px; }
  .tr { right: 32px; text-align: right; }
  .tl .name { font-size: 22px; font-weight: 700; letter-spacing: 0.22em; }
  .status { margin-top: 8px; display: flex; align-items: center; gap: 10px;
            font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.18em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #5dff9a;
         box-shadow: 0 0 10px #5dff9a; animation: pulse 2s ease-in-out infinite; }
  .status.offline .dot { background: #ff5b3a; box-shadow: 0 0 10px #ff5b3a; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .tr .time { font-size: 30px; font-weight: 500; letter-spacing: 0.12em; font-variant-numeric: tabular-nums; }
  .tr .date { margin-top: 6px; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.16em; color: var(--gold-soft); }

  /* Core */
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  svg#core {
    width: min(86vmin, 760px); height: min(86vmin, 760px);
    filter: drop-shadow(0 0 18px rgba(255,198,26,0.35));
    overflow: visible;
  }
  .spin-cw  { transform-origin: 400px 400px; animation: cw 40s linear infinite; }
  .spin-ccw { transform-origin: 400px 400px; animation: ccw 26s linear infinite; }
  .spin-fast{ transform-origin: 400px 400px; animation: cw 9s linear infinite; }
  .spin-slow{ transform-origin: 400px 400px; animation: ccw 70s linear infinite; }
  @keyframes cw  { to { transform: rotate(360deg); } }
  @keyframes ccw { to { transform: rotate(-360deg); } }
  .core-glow { animation: breathe 4s ease-in-out infinite; transform-origin: 400px 400px; }
  @keyframes breathe { 50% { opacity: 0.55; transform: scale(1.06); } }
  .label {
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 34px;
    letter-spacing: 0.14em; fill: var(--gold-soft); text-anchor: middle;
    dominant-baseline: middle;
    filter: drop-shadow(0 0 8px rgba(255,198,26,0.9));
  }
  .sub { font-family: 'Rajdhani', sans-serif; font-size: 14px; letter-spacing: 0.3em; fill: var(--gold); text-anchor: middle; }
  .tick-text { font-family: 'Orbitron', sans-serif; font-size: 10px; fill: var(--gold-dim); }

  @media (prefers-reduced-motion: reduce) {
    .spin-cw, .spin-ccw, .spin-fast, .spin-slow, .core-glow, .dot { animation: none; }
  }
  @media (max-width: 560px) {
    .tl .name { font-size: 16px; } .tr .time { font-size: 20px; }
    .corner { top: 16px; } .tl { left: 16px; } .tr { right: 16px; }
    .status, .tr .date { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="grid"></div>
<canvas id="particles"></canvas>

<div class="corner tl">
  <div class="name">V.I.S.I.O.N</div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">SYSTEM ONLINE</span></div>
</div>
<div class="corner tr">
  <div class="time" id="time">--:--:--</div>
  <div class="date" id="date">---</div>
</div>

<div class="stage">
<svg id="core" viewBox="0 0 800 800" aria-label="V.I.S.I.O.N core">
  <defs>
    <radialGradient id="coreFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe98a" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffc61a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffc61a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft glow -->
  <circle class="core-glow" cx="400" cy="400" r="200" fill="url(#coreFill)"/>

  <!-- outermost dotted ring + tick marks (slow) -->
  <g class="spin-slow">
    <circle cx="400" cy="400" r="370" fill="none" stroke="#ffc61a" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="400" cy="400" r="362" fill="none" stroke="#ffc61a" stroke-opacity="0.5" stroke-width="6" stroke-dasharray="1 11.3"/>
  </g>

  <!-- segmented arcs (clockwise) -->
  <g class="spin-cw" fill="none" stroke="#ffc61a" stroke-linecap="round">
    <circle cx="400" cy="400" r="335" stroke-width="3" stroke-opacity="0.9" stroke-dasharray="380 200 120 200 260 200 90 240"/>
    <circle cx="400" cy="400" r="322" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="4 6"/>
  </g>

  <!-- tick ring (counter-clockwise) -->
  <g class="spin-ccw">
    <circle cx="400" cy="400" r="295" fill="none" stroke="#ffdf6b" stroke-width="14" stroke-opacity="0.35" stroke-dasharray="2 13.2"/>
    <circle cx="400" cy="400" r="282" fill="none" stroke="#ffc61a" stroke-width="4" stroke-linecap="round" stroke-dasharray="210 120 60 90 180 100 40 60"/>
    <text class="tick-text" x="400" y="98" text-anchor="middle">00</text>
    <text class="tick-text" x="702" y="404" text-anchor="middle">90</text>
    <text class="tick-text" x="400" y="710" text-anchor="middle">180</text>
    <text class="tick-text" x="98" y="404" text-anchor="middle">270</text>
  </g>

  <!-- bright arcs (clockwise, fast) -->
  <g class="spin-fast" fill="none" stroke="#ffe98a" stroke-linecap="round">
    <circle cx="400" cy="400" r="250" stroke-width="5" stroke-dasharray="170 700" style="filter:drop-shadow(0 0 6px #ffc61a)"/>
    <circle cx="400" cy="400" r="250" stroke-width="5" stroke-dasharray="90 700" stroke-dashoffset="-785" style="filter:drop-shadow(0 0 6px #ffc61a)"/>
  </g>

  <!-- inner arcs (counter-clockwise) -->
  <g class="spin-ccw" style="animation-duration:14s" fill="none" stroke="#ffc61a" stroke-linecap="round">
    <circle cx="400" cy="400" r="215" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="120 60 30 60 200 60 60 60"/>
    <circle cx="400" cy="400" r="200" stroke-width="8" stroke-opacity="0.5" stroke-dasharray="3 9"/>
  </g>

  <!-- static core rim -->
  <circle cx="400" cy="400" r="165" fill="rgba(20,14,4,0.7)" stroke="#ffc61a" stroke-width="2.5" style="filter:drop-shadow(0 0 8px #ffc61a)"/>
  <circle cx="400" cy="400" r="155" fill="none" stroke="#ffdf6b" stroke-opacity="0.4" stroke-width="1"/>

  <!-- inner reticle -->
  <g class="spin-cw" style="animation-duration:20s" fill="none" stroke="#ffc61a" stroke-opacity="0.7">
    <circle cx="400" cy="400" r="140" stroke-width="1" stroke-dasharray="2 5"/>
    <path d="M400 245 v18 M400 555 v-18 M245 400 h18 M555 400 h-18" stroke-width="2"/>
  </g>

  <!-- label -->
  <text class="label" x="400" y="392">V.I.S.I.O.N</text>
  <text class="sub" x="400" y="428">CORE ACTIVE</text>
</svg>
</div>

<script>
/* Clock + status */
const timeEl = document.getElementById('time');
const dateEl = document.getElementById('date');
function tick() {
  const d = new Date();
  timeEl.textContent = d.toLocaleTimeString([], { hour12: false });
  dateEl.textContent = d.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
}
tick(); setInterval(tick, 1000);

const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
function setStatus(online) {
  statusEl.classList.toggle('offline', !online);
  statusText.textContent = online ? 'SYSTEM ONLINE' : 'SYSTEM OFFLINE';
}
setStatus(navigator.onLine);
addEventListener('online', () => setStatus(true));
addEventListener('offline', () => setStatus(false));

/* Particles flowing up from center */
const cv = document.getElementById('particles');
const ctx = cv.getContext('2d');
let W, H, dpr;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COUNT = 140;
const ps = [];
function spawn(p = {}) {
  p.x = W / 2 + (Math.random() - 0.5) * Math.min(W, H) * 0.22;
  p.y = H / 2 + (Math.random() - 0.5) * 30;
  p.vy = 0.4 + Math.random() * 1.3;
  p.vx = (Math.random() - 0.5) * 0.35;
  p.r = 0.6 + Math.random() * 1.8;
  p.life = 0;
  p.max = 120 + Math.random() * 260;
  p.sway = Math.random() * Math.PI * 2;
  return p;
}
for (let i = 0; i < COUNT; i++) { const p = spawn(); p.life = Math.random() * p.max; ps.push(p); }

function frame() {
  ctx.clearRect(0, 0, W, H);
  for (const p of ps) {
    if (!reduce) {
      p.life++;
      p.y -= p.vy;
      p.x += p.vx + Math.sin(p.life * 0.02 + p.sway) * 0.25;
    }
    if (p.life > p.max || p.y < -10) spawn(p);
    const t = p.life / p.max;
    const a = Math.sin(Math.PI * t);           // fade in, fade out
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, ${190 + 50 * (1 - t) | 0}, 60, ${a * 0.85})`;
    ctx.shadowColor = 'rgba(255,198,26,0.9)';
    ctx.shadowBlur = 8;
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
